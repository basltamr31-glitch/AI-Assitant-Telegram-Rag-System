# =============================================================================
#  Infrastructure for the Telegram AI Assistant (development)
# =============================================================================
#  Start:   docker compose up -d
#  Stop:    docker compose down            (keeps data)
#  Reset:   docker compose down -v         (DELETES all data - volumes too)
#  Status:  docker compose ps
#  Logs:    docker compose logs -f n8n
#
#  Compose automatically reads `.env` in this folder, so ${VARIABLES} below
#  come from the same file Python reads. One source of truth.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL - conversation history, users, logs, ingestion runs
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # "host:container" - we publish 5432 so Python on your HOST can connect.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Compose asks the container "are you actually ready?", not just "running?"
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Qdrant - vector database. Dashboard: http://localhost:6333/dashboard
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: assistant-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP / REST API + web dashboard
      - "6334:6334"   # gRPC (faster; the Python client can use either)
    volumes:
      - qdrant_data:/qdrant/storage
    # No healthcheck: the Qdrant image ships without curl/wget, so any HTTP
    # healthcheck would fail for the wrong reason. We verify it from Python
    # instead, in scripts/check_env.py - a more honest test anyway.

  # ---------------------------------------------------------------------------
  # n8n - workflow orchestration. UI: http://localhost:5678
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: assistant-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # Encrypts saved credentials. Change it and n8n loses access to them.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}
      # Task runners: the current execution model for Code nodes.
      N8N_RUNNERS_ENABLED: "true"
      # Don't phone home with usage analytics.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      # Lets n8n reach services running on YOUR machine (Phase 4: the Python
      # API on :8000) via http://host.docker.internal:8000
      # Docker Desktop provides this automatically; this line makes the file
      # work identically on a plain Linux server later.
      - "host.docker.internal:host-gateway"

# -----------------------------------------------------------------------------
# Named volumes: Docker-managed storage that SURVIVES `docker compose down`.
# Without these, every restart would wipe your database and your workflows.
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
  qdrant_data:
  n8n_data:
